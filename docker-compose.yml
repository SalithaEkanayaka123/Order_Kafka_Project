version: "3.8"   # Docker Compose file format version

services:         # All containers/services start here

  postgres:       # PostgreSQL service name

    image: postgres:16
    # Uses PostgreSQL version 16 Docker image

    container_name: local-postgres
    # Actual container name shown in Docker

    environment:
      POSTGRES_DB: orderdb
      # Automatically creates database named "orderdb"

      POSTGRES_USER: user
      # PostgreSQL username

      POSTGRES_PASSWORD: password
      # PostgreSQL password

    ports:
      - "5432:5432"
      # Left side = your local machine port
      # Right side = container port
      # Access DB locally using localhost:5432


  kafka:           # Kafka service name

    image: apache/kafka:3.7.0
    # Uses Apache Kafka version 3.7.0 image

    container_name: local-kafka
    # Docker container name

    ports:
      - "9092:9092"
      # Kafka exposed on localhost:9092


    environment:

      KAFKA_NODE_ID: 1
      # Unique ID for Kafka broker
      # Single broker = 1

      KAFKA_PROCESS_ROLES: broker,controller
      # Kafka runs as:
      # broker     -> handles messages/topics
      # controller -> manages Kafka cluster metadata

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # Defines internal listening ports
      # 9092 = Kafka client communication
      # 9093 = Controller communication

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      # Address applications use to connect to Kafka
      # Spring Boot connects using localhost:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Tells Kafka which listener acts as controller

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      # Defines security protocol
      # Using PLAINTEXT = no SSL/security locally

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # Defines controller node
      # Node ID 1 runs on localhost:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Kafka stores consumer offsets internally
      # Replication factor = 1 because only one broker exists locally